name: Build PDF Studio

on:
  # Manual only: GitHub -> Actions -> "Build PDF Studio" -> Run workflow
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: publish a GitHub release with this tag (e.g. v1.0.1). Leave empty to only build."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest      # 32-bit Windows (x86) - the only target
            pdfium: pdfium-win-x86
            lib: bin/pdfium.dll
            args: --target i686-pc-windows-msvc
            target: i686-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Download pdfium (${{ matrix.pdfium }})
        shell: bash
        run: |
          mkdir -p pdfium-dl src-tauri/pdfium
          curl -fsSL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium }}.tgz"
          tar -xzf pdfium.tgz -C pdfium-dl
          cp "pdfium-dl/${{ matrix.lib }}" src-tauri/pdfium/
          ls -la src-tauri/pdfium

      - run: npm install

      - name: Generate icons
        run: npx tauri icon public/favicon.svg

      - name: Build app
        run: npx tauri build ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*

  release:
    if: ${{ inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist-artifacts/**/*.msi
            dist-artifacts/**/*.exe
